# `main` mirrors `develop`: every push or merged PR into `develop` fast-forwards
# `main` to the same commit. Nothing is committed to `main` directly.

name: Sync main

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to develop
        run: git push origin "${{ github.sha }}:refs/heads/main"
