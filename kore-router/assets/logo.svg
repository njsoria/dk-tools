<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kore Model Router: one prompt in, four models out, one route chosen">
  <title>Kore Model Router</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c24"/>
      <stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#AADD00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#AADD00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#f7f7f8" stroke-opacity="0.08" stroke-width="2"/>

  <!-- The routes not taken: one to each model, weakest at the bottom. -->
  <g fill="none" stroke="#f7f7f8" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round">
    <path d="M120 256C250 256 230 112 372 112"/>
    <path d="M120 256C250 256 250 304 372 304"/>
    <path d="M120 256C250 256 230 400 372 400"/>
  </g>
  <g fill="#f7f7f8" fill-opacity="0.55">
    <circle cx="392" cy="304" r="18"/>
    <circle cx="392" cy="400" r="14"/>
  </g>
  <!-- The strongest model, which coordinates: a ring, not a dot. -->
  <circle cx="392" cy="112" r="21" fill="none" stroke="#f7f7f8" stroke-opacity="0.7" stroke-width="8"/>

  <!-- The route this prompt takes. -->
  <circle cx="392" cy="208" r="64" fill="url(#glow)"/>
  <path d="M120 256C250 256 250 208 364 208" fill="none" stroke="#AADD00" stroke-width="14" stroke-linecap="round"/>
  <circle cx="392" cy="208" r="26" fill="#AADD00"/>

  <!-- The prompt, and the point where it is sorted. -->
  <circle cx="120" cy="256" r="34" fill="#121217" stroke="#f7f7f8" stroke-width="10"/>
  <circle cx="120" cy="256" r="11" fill="#AADD00"/>
</svg>
